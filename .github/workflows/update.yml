name: 每日更新板块数据

on:
  schedule:
    - cron: '40 9 * * 1-5'     # 北京时间 17:40，周一到周五
  workflow_dispatch:            # 也可以在 Actions 页面手动点 Run workflow

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 恢复已下载的历史数据
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - name: 安装依赖
        run: pip install akshare pandas requests

      - name: 抓取数据
        run: python scripts/fetch.py

      - name: 保存历史数据
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 生成网页数据
        run: python scripts/build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 记录更新时间（保持仓库活跃，避免定时任务被 GitHub 停用）
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add last_update.txt
          git commit -m "update $(date +%F)" || echo "no change"
          git pull --rebase || true
          git push || echo "push skipped"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
